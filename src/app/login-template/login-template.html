<div class="container mt-4" style="max-width: 500px; margin: auto; padding: 20px;">
  <h2>Formulario de Login (Plantilla)</h2>

  <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group mb-3" style="margin-bottom: 15px;">
      <label for="username">Username</label>
      <input 
        id="username" 
        name="username" 
        class="form-control" 
        type="text" 
        required 
        minlength="4" 
        [(ngModel)]="usuario.username" 
        #username="ngModel"
        style="width: 100%; padding: 8px; margin-top: 5px;">
      
      <div *ngIf="username.invalid && (username.dirty || username.touched)" style="color: red; font-size: 0.85rem; margin-top: 5px;">
        <div *ngIf="username.errors?.['required']">El Username es requerido.</div>
        <div *ngIf="username.errors?.['minlength']">El Username debe tener al menos 4 caracteres.</div>
      </div>
    </div>


    <div class="form-group mb-3" style="margin-bottom: 15px;">
      <label for="contrasena">Contraseña</label>
      <input 
        id="contrasena" 
        name="contrasena" 
        class="form-control" 
        type="password" 
        required 
        minlength="6" 
        [(ngModel)]="usuario.contrasena" 
        #contrasena="ngModel"
        style="width: 100%; padding: 8px; margin-top: 5px;">
      
      <div *ngIf="contrasena.invalid && (contrasena.dirty || contrasena.touched)" style="color: red; font-size: 0.85rem; margin-top: 5px;">
        <div *ngIf="contrasena.errors?.['required']">La Contraseña es requerida.</div>
        <div *ngIf="contrasena.errors?.['minlength']">La Contraseña debe tener al menos 6 caracteres.</div>
      </div>
    </div>


    <div class="form-group mb-3" style="margin-bottom: 15px;">
      <label for="correo">Correo</label>
      <input 
        id="correo" 
        name="correo" 
        class="form-control" 
        type="email" 
        required 
        minlength="5" 
        [(ngModel)]="usuario.correo" 
        #correo="ngModel"
        style="width: 100%; padding: 8px; margin-top: 5px;">
      
      <div *ngIf="correo.invalid && (correo.dirty || correo.touched)" style="color: red; font-size: 0.85rem; margin-top: 5px;">
        <div *ngIf="correo.errors?.['required']">El Correo es requerido.</div>
        <div *ngIf="correo.errors?.['minlength']">El Correo debe tener al menos 5 caracteres.</div>
      </div>
    </div>

    <button 
      type="submit" 
      class="btn btn-success" 
      [disabled]="!loginForm.form.valid"
      style="padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer;">
      Enviar
    </button>

  </form>
</div>
