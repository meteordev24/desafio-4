<app-header></app-header>

<div id="carouselBasicExample" class="carousel slide carousel-fade" data-mdb-ride="carousel" data-mdb-carousel-init>
  <div class="carousel-indicators">
    <button type="button" data-mdb-target="#carouselBasicExample" data-mdb-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-mdb-target="#carouselBasicExample" data-mdb-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-mdb-target="#carouselBasicExample" data-mdb-slide-to="2" aria-label="Slide 3"></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="banner1.jpg" class="d-block w-100" alt="Banner Principal"/>
    </div>
    <div class="carousel-item">
      <img src="banner2.jpg" class="d-block w-100" alt="Segundo Banner"/>
    </div>
    <div class="carousel-item">
      <img src="banner3.jpg" class="d-block w-100" alt="Tercer Banner"/>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-mdb-target="#carouselBasicExample" data-mdb-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-mdb-target="#carouselBasicExample" data-mdb-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>

<div class="cards-container" style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center;">
  
  <mat-card *ngFor="let item of productos" style="width: 300px; cursor: pointer;" [routerLink]="['/descripcion', item.id]">
    <mat-card-header>
      <mat-card-title>{{ item.nombre }}</mat-card-title>
      <mat-card-subtitle [style.font-size]="item.precio > 100 ? 'x-large' : 'normal'">
        Precio: ${{ item.precio }}
      </mat-card-subtitle>
    </mat-card-header>
    
    <img mat-card-image [src]="item.imagenUrl" alt="{{ item.nombre }}">
    
    <mat-card-content>
      <p>Método de entrega: {{ item.tipoEnvio }}</p>
    </mat-card-content>
    
    <mat-card-actions>
      <button mat-button>VER DETALLE</button>
    </mat-card-actions>
  </mat-card>

</div>

<router-outlet></router-outlet>
